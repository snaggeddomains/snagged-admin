[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketplace-pipeline"
version = "0.1.0"
description = "Marketplace data pipelines feeding Slack, Google Sheets, and the name universe."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "requests>=2.31",
    # TLS/JA3-impersonating HTTP client — passes Cloudflare Bot Management
    # (managed challenge) that flags plain `requests`, so the Atom feed fetch
    # can pull the 127 MB CSV directly instead of via scrape.do (which 502s on
    # a download that large). See sources/atom_daily.py `_fetch_via_curl_cffi`.
    "curl_cffi>=0.7",
    "slack-sdk>=3.26",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "duckdb>=0.10",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "wordfreq>=3.1",
    "nltk>=3.8",
    "supabase>=2.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "playwright>=1.40",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]

[project.scripts]
pipeline = "marketplace_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

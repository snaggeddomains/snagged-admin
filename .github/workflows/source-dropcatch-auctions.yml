name: 'Source: dropcatch_auctions'

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: source-dropcatch_auctions
  cancel-in-progress: false

jobs:
  run:
    # Pin the runner image (not `ubuntu-latest`) so a GitHub image refresh can't
    # silently shift preinstalled libs under the headless browser.
    runs-on: ubuntu-24.04
    # Playwright + chromium install adds ~3-5 min on top of usual runtime
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Install Playwright Chromium
        # `chromium` alone does NOT install the headless-shell binary that a
        # headless launch needs on current Playwright — when the pinned-only
        # `chromium` install and a freshly-resolved Playwright disagree, the
        # launch dies with "Executable doesn't exist … chrome-headless-shell".
        # Install the headless shell explicitly so a Playwright bump can't
        # reintroduce that failure (broke dropcatch 2026-06-03).
        run: python -m playwright install --with-deps chromium chromium-headless-shell

      - name: Run dropcatch_auctions
        env:
          SLACK_BOT_TOKEN:             ${{ secrets.SLACK_BOT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SLACK_CHANNEL_AUCTIONS:      ${{ vars.SLACK_CHANNEL_AUCTIONS }}
        run: pipeline run dropcatch_auctions

      - name: Commit state changes
        if: ${{ !cancelled() }}
        uses: ./.github/actions/commit-state
        with:
          message: "dropcatch_auctions: state $(date -u +%Y-%m-%dT%H:%M:%SZ)"

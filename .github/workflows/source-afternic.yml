name: 'Source: afternic'

# Dispatched daily by an EXTERNAL scheduler (Vercel Cron -> /api/cron/afternic ->
# workflow_dispatch) at the start of the 4 AM ET SLA window — NOT by the SNAP
# Orchestrator. afternic used to run inside the orchestrator, but sharing that
# runner's 2 cores with the sequential foreground sources slowed it to >3h and it
# was killed by the orchestrator's job timeout. On its OWN runner it's back to
# ~40 min, so it now lives here. workflow_dispatch also lets it be (re)run
# individually.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: source-afternic
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Afternic scans ~27M rows and upserts ~6.2M to name_universe in 1K batches:
    # ~60 min on a clean run, but slow-Supabase days have hit ~106 min. afternic
    # has no SLA of its own now (it's decoupled from the orchestrator), so the
    # timeout is just a generous safety net — keep it well above the slow case.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run afternic
        env:
          # Unbuffer Python stdout so progress + transient-retry lines stream to the
          # Actions log in real time (a buffered run shows nothing until it ends —
          # and nothing at all if it's cancelled mid-run).
          PYTHONUNBUFFERED:            "1"
          SLACK_BOT_TOKEN:             ${{ secrets.SLACK_BOT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SLACK_CHANNEL_SNAP:          ${{ vars.SLACK_CHANNEL_SNAP }}
          SUPABASE_NAMING_URL:         ${{ secrets.SUPABASE_NAMING_URL }}
          SUPABASE_NAMING_SERVICE_KEY: ${{ secrets.SUPABASE_NAMING_SERVICE_KEY }}

        run: pipeline run afternic

      - name: Commit state changes
        if: ${{ !cancelled() }}
        uses: ./.github/actions/commit-state
        with:
          message: "afternic: state $(date -u +%Y-%m-%dT%H:%M:%SZ)"

name: 'Source: afternic'

# Scheduling is owned by "SNAP Orchestrator" (snap-orchestrator.yml), dispatched
# by an external scheduler so runs land close to their SLA times instead of
# relying on GitHub's best-effort `schedule:`. Only workflow_dispatch remains so
# this source can still be (re)run individually.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: source-afternic
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Afternic publishes ~7M qualifying rows; upserting in 1K batches takes
    # ~25-40 min normally. 120 min is a safety net for slow-Supabase days (the
    # writer now recycles its client on a GOAWAY so it no longer crawls).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run afternic
        env:
          # Unbuffer Python stdout so progress + transient-retry lines stream to the
          # Actions log in real time (a buffered run shows nothing until it ends —
          # and nothing at all if it's cancelled mid-run).
          PYTHONUNBUFFERED:            "1"
          SLACK_BOT_TOKEN:             ${{ secrets.SLACK_BOT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SLACK_CHANNEL_SNAP:          ${{ vars.SLACK_CHANNEL_SNAP }}
          SUPABASE_NAMING_URL:         ${{ secrets.SUPABASE_NAMING_URL }}
          SUPABASE_NAMING_SERVICE_KEY: ${{ secrets.SUPABASE_NAMING_SERVICE_KEY }}

        run: pipeline run afternic

      - name: Commit state changes
        if: ${{ !cancelled() }}
        uses: ./.github/actions/commit-state
        with:
          message: "afternic: state $(date -u +%Y-%m-%dT%H:%M:%SZ)"

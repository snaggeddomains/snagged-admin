name: 'Source: afternic'

# Scheduling is owned by "SNAP Orchestrator" (snap-orchestrator.yml), dispatched
# by an external scheduler so runs land close to their SLA times instead of
# relying on GitHub's best-effort `schedule:`. Only workflow_dispatch remains so
# this source can still be (re)run individually.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: source-afternic
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Afternic publishes ~7M qualifying rows; upserting in 5K batches takes
    # ~25-40 min depending on Supabase latency. Bumped to 90 min headroom.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run afternic
        env:
          SLACK_BOT_TOKEN:             ${{ secrets.SLACK_BOT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SLACK_CHANNEL_SNAP:          ${{ vars.SLACK_CHANNEL_SNAP }}
          SUPABASE_NAMING_URL:         ${{ secrets.SUPABASE_NAMING_URL }}
          SUPABASE_NAMING_SERVICE_KEY: ${{ secrets.SUPABASE_NAMING_SERVICE_KEY }}

        run: pipeline run afternic

      - name: Commit state changes
        if: success()
        uses: ./.github/actions/commit-state
        with:
          message: "afternic: state $(date -u +%Y-%m-%dT%H:%M:%SZ)"

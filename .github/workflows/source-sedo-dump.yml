name: 'Source: sedo_dump'

# Weekly full-inventory Sedo crawl (partitioned to beat the 10k deep-page
# cap). Feeds name_universe (Supabase). Runs on GitHub-hosted runners
# because Sedo's edge IP-allowlists GH runner ranges (it 403s other IPs).

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 8 * * 0"   # weekly, Sunday 08:00 UTC (~4 AM ET)

permissions:
  contents: write

concurrency:
  group: source-sedo_dump
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run sedo_dump
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_NAMING_URL:         ${{ secrets.SUPABASE_NAMING_URL }}
          SUPABASE_NAMING_SERVICE_KEY: ${{ secrets.SUPABASE_NAMING_SERVICE_KEY }}
          # Crawl budget: generous enough to capture the full ~280k inventory.
          SEDO_DUMP_TIME_BUDGET_SEC: "9000"
          SEDO_DUMP_MAX_REQUESTS: "12000"
        run: pipeline run sedo_dump
      - name: Commit state changes
        if: success()
        uses: ./.github/actions/commit-state
        with:
          message: "sedo_dump: state $(date -u +%Y-%m-%dT%H:%M:%SZ)"

name: 'Source: sedo_dump'

# Full-inventory Sedo crawl (partitioned to beat the 10k deep-page cap).
# Feeds name_universe (Supabase). Runs on GitHub-hosted runners because
# Sedo's edge IP-allowlists GH runner ranges (it 403s other IPs).
#
# Manual / on-demand only (no cron): the daily sedo_net_new feed covers new
# arrivals; this full dump is run by hand when we want to refresh the long
# tail — re-observe staleness (sold/delisted), pick up price drift, and
# catch org/xyz/dev coverage. Dispatch from the Actions tab when needed.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: source-sedo_dump
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330        # under GitHub's 360-min hard cap
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run sedo_dump
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_NAMING_URL:         ${{ secrets.SUPABASE_NAMING_URL }}
          SUPABASE_NAMING_SERVICE_KEY: ${{ secrets.SUPABASE_NAMING_SERVICE_KEY }}
          # Crawl budget: generous enough to capture the full ~280k inventory
          # in one run; self-stops at the budget well before the job hard cap.
          SEDO_DUMP_TIME_BUDGET_SEC: "18000"   # 300 min
          SEDO_DUMP_MAX_REQUESTS: "25000"
        run: pipeline run sedo_dump
      - name: Commit state changes
        if: always()   # capture partial/failed state too — the crawler streams progress
        uses: ./.github/actions/commit-state
        with:
          message: "sedo_dump: state $(date -u +%Y-%m-%dT%H:%M:%SZ)"

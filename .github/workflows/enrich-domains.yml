name: Enrich domains (LLM)

# Fills category/emotions/keywords/industries on rows that don't have them yet,
# in either corpus. Dry-run by default — flip `commit` to true to actually call
# the API and write. Resumable: re-run to continue (selection is
# category IS NULL AND enriched_at IS NULL). See tools/enrich.py for the rails.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which corpus to enrich
        type: choice
        options: [universe, master]
        default: universe
      commit:
        description: Actually call the API + write (otherwise dry-run preview)
        type: boolean
        default: false
      max_rows:
        description: Cap rows processed this run
        default: "500"
      batch:
        description: Domains per LLM call
        default: "25"
      concurrency:
        description: LLM calls in flight at once
        default: "8"
      model:
        description: Enrichment model (blank = default)
        default: ""
      order:
        description: Row priority (blank = universe:quality, master:domain)
        type: choice
        options: ["", quality, price, domain]
        default: ""
      tld:
        description: Restrict to a TLD (e.g. com; blank = all)
        default: ""
      single_word:
        description: Only one-word names
        type: boolean
        default: false
      dict_word:
        description: Only dictionary-word names
        type: boolean
        default: false
      quality_min:
        description: quality_score >= (universe only; blank = no floor)
        default: ""
      quality_max:
        description: quality_score < (universe only; blank = no ceiling)
        default: ""
      len_max:
        description: sld_length <= (blank = no cap)
        default: ""
      no_numbers:
        description: Exclude names containing digits
        type: boolean
        default: false
      no_copy_overlap:
        description: Skip the free cross-store copy (LLM every row for complete, consistent fields)
        type: boolean
        default: false
      retry_failed:
        description: Revisit rows attempted before but still empty
        type: boolean
        default: false
      reenrich:
        description: Re-do every row in scope, overwriting existing enrichment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: enrich-domains-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Enrich
        env:
          ANTHROPIC_API_KEY:             ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_NAMING_URL:           ${{ secrets.SUPABASE_NAMING_URL }}
          SUPABASE_NAMING_SERVICE_KEY:   ${{ secrets.SUPABASE_NAMING_SERVICE_KEY }}
          MASTERLIST_SUPABASE_URL:        ${{ secrets.MASTERLIST_SUPABASE_URL }}
          MASTERLIST_SUPABASE_SECRET_KEY: ${{ secrets.MASTERLIST_SUPABASE_SECRET_KEY }}
        run: |
          pipeline enrich \
            --target "${{ github.event.inputs.target }}" \
            --max-rows "${{ github.event.inputs.max_rows }}" \
            --batch "${{ github.event.inputs.batch }}" \
            --concurrency "${{ github.event.inputs.concurrency }}" \
            ${{ github.event.inputs.model != '' && format('--model {0}', github.event.inputs.model) || '' }} \
            ${{ github.event.inputs.order != '' && format('--order {0}', github.event.inputs.order) || '' }} \
            ${{ github.event.inputs.tld != '' && format('--tld {0}', github.event.inputs.tld) || '' }} \
            ${{ github.event.inputs.single_word == 'true' && '--single-word' || '' }} \
            ${{ github.event.inputs.dict_word == 'true' && '--dict-word' || '' }} \
            ${{ github.event.inputs.quality_min != '' && format('--quality-min {0}', github.event.inputs.quality_min) || '' }} \
            ${{ github.event.inputs.quality_max != '' && format('--quality-max {0}', github.event.inputs.quality_max) || '' }} \
            ${{ github.event.inputs.len_max != '' && format('--len-max {0}', github.event.inputs.len_max) || '' }} \
            ${{ github.event.inputs.no_numbers == 'true' && '--no-numbers' || '' }} \
            ${{ github.event.inputs.no_copy_overlap == 'true' && '--no-copy-overlap' || '' }} \
            ${{ github.event.inputs.commit == 'true' && '--commit' || '' }} \
            ${{ github.event.inputs.retry_failed == 'true' && '--retry-failed' || '' }} \
            ${{ github.event.inputs.reenrich == 'true' && '--reenrich' || '' }}

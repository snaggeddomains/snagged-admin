name: 'Maintenance: universe_sync (DISABLED — sources direct-upsert now)'

# Disabled 2026-05-30. Each source workflow now upserts its own rows
# directly to Supabase at the end of its own run (moved to that pattern
# when Afternic's snapshot.json hit GitHub's 100MB file limit).
# This workflow was re-processing the same data and recently timed out
# on Postgres statement timeout when batching 341K merged rows through
# the RPC's complex array-union merge logic.
#
# The pipeline universe-sync CLI command stays around as a manual batch-
# reprocessing tool if we ever need to bulk-rebuild from local snapshots.
# Re-enable the scheduled cron by uncommenting `schedule:` below.
on:
  # schedule:
  #   - cron: '0 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: maintenance-universe-sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run universe-sync
        env:
          SUPABASE_NAMING_URL:          ${{ secrets.SUPABASE_NAMING_URL }}
          SUPABASE_NAMING_SERVICE_KEY:  ${{ secrets.SUPABASE_NAMING_SERVICE_KEY }}
          R2_ACCESS_KEY_ID:             ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:         ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:                    ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT:                  ${{ secrets.R2_ENDPOINT }}
        run: pipeline universe-sync

      - name: Commit state changes
        if: success() || failure()
        uses: ./.github/actions/commit-state
        with:
          message: "universe_sync: state $(date -u +%Y-%m-%dT%H:%M:%SZ)"

name: Backfill universe structural fields

# Fills wordfreq-derived structural fields (num_words, num_syllables,
# is_dictionary_word, zipf_score, quality_score, deal_score) on name_universe
# rows that are missing them — e.g. rows loaded by a direct SQL/CSV import
# (BrandBucket) rather than the normal pipeline path. Idempotent + resumable
# (gated on num_syllables IS NULL). Run on demand.
#
# When dispatched by the admin Imports tool with then_enrich=true, it chains a
# quality-banded LLM enrich-batch submit AFTER the backfill (so quality_score
# exists), scoped to the just-imported source so only its new names are charged.
on:
  workflow_dispatch:
    inputs:
      rescore:
        description: Recompute scores + part_of_speech on EVERY row (not just rows missing structural fields)
        type: boolean
        default: false
      then_enrich:
        description: After backfill, submit a quality-banded enrich batch for the new names
        type: boolean
        default: false
      enrich_quality_min:
        description: quality_score floor for the auto-enrich (blank = no floor)
        default: ""
      enrich_source:
        description: Limit the auto-enrich to this source (blank = all eligible)
        default: ""
      enrich_new_since:
        description: Net-new only — enrich rows created at/after this ISO time (blank = all)
        default: ""

permissions:
  contents: write

concurrency:
  group: backfill-universe-structural
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_NAMING_URL:         ${{ secrets.SUPABASE_NAMING_URL }}
      SUPABASE_NAMING_SERVICE_KEY: ${{ secrets.SUPABASE_NAMING_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Backfill structural fields
        run: pipeline backfill-structural ${{ github.event.inputs.rescore == 'true' && '--rescore' || '' }}

      # Optional second leg: enrich the freshly-scored, freshly-imported names.
      # Runs only when the import asked for it; --source keeps it to this import.
      # Values come in as env vars + a bash array so a source with spaces
      # (e.g. "Reflex Publishing") is quoted correctly.
      - name: Auto-enrich new names (quality-banded, Batches API)
        if: ${{ github.event.inputs.then_enrich == 'true' }}
        env:
          ENRICH_QMIN:  ${{ github.event.inputs.enrich_quality_min }}
          ENRICH_SRC:   ${{ github.event.inputs.enrich_source }}
          ENRICH_SINCE: ${{ github.event.inputs.enrich_new_since }}
        run: |
          args=(auto --commit --target universe --min-batch-saving 5)
          [ -n "$ENRICH_QMIN" ]  && args+=(--quality-min "$ENRICH_QMIN")
          [ -n "$ENRICH_SRC" ]   && args+=(--source "$ENRICH_SRC")
          [ -n "$ENRICH_SINCE" ] && args+=(--new-since "$ENRICH_SINCE")
          pipeline enrich-batch "${args[@]}"
      - name: Commit enrich-batch state
        if: ${{ success() && github.event.inputs.then_enrich == 'true' }}
        uses: ./.github/actions/commit-state
        with:
          message: "enrich-batch: auto-submit after universe import"

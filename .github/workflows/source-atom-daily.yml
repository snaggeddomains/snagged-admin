name: 'Source: atom_daily'

# Scheduling is owned by "SNAP Orchestrator" (snap-orchestrator.yml), which runs
# ATOM after afternic so its >4 AM ET feed refresh is ready. Only
# workflow_dispatch remains so this source can still be (re)run individually.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: source-atom_daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # atom_daily upserts ~260K universe rows sequentially after the feed fetch,
    # which takes ~25 min (more with transient-retry backoffs) — 15 min cancelled
    # it mid-upsert. The orchestrator (120 min) already accommodates this; give the
    # standalone manual re-run the same headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # Chromium for the last-resort headless-browser fetch fallback (used only
      # when curl_cffi/direct/scrape.do are all blocked by a Cloudflare JS
      # challenge). The orchestrator workflow already installs this.
      - name: Install Chromium for the browser fallback
        run: python -m playwright install --with-deps chromium chromium-headless-shell

      - name: Run atom_daily
        env:
          SLACK_BOT_TOKEN:             ${{ secrets.SLACK_BOT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SLACK_CHANNEL_SNAP:          ${{ vars.SLACK_CHANNEL_SNAP }}
          SUPABASE_NAMING_URL:         ${{ secrets.SUPABASE_NAMING_URL }}
          SUPABASE_NAMING_SERVICE_KEY: ${{ secrets.SUPABASE_NAMING_SERVICE_KEY }}
          SCRAPE_DO_TOKEN:             ${{ secrets.SCRAPE_DO_TOKEN }}
          ATOM_PARTNERSHIP_KEY:        ${{ secrets.ATOM_PARTNERSHIP_KEY }}  # direct API (bypasses Cloudflare CSV)
          ATOM_USER_ID:                ${{ secrets.ATOM_USER_ID }}

        run: pipeline run atom_daily

      - name: Commit state changes
        if: ${{ !cancelled() }}
        uses: ./.github/actions/commit-state
        with:
          message: "atom_daily: state $(date -u +%Y-%m-%dT%H:%M:%SZ)"

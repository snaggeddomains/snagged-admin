name: SNAP Orchestrator

# Single sequential runner for the daily SNAP + auction batch. Triggered by an
# EXTERNAL scheduler (Vercel Cron -> workflow_dispatch) instead of GitHub's
# best-effort `schedule:`, which delays/drops runs and broke the 7 AM ET SLA.
# Runs each source in order, CONTINUING to the next even if one fails, then
# flags the run as failed at the end (so the auto-fix workflow + watchdog see
# it). State is committed even on partial failure.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = run every source; ping = no-op connectivity test"
        type: choice
        options: [full, ping]
        default: full

permissions:
  contents: write

concurrency:
  group: snap-orchestrator
  cancel-in-progress: false

jobs:
  run:
    # Pin the runner image (not `ubuntu-latest`) so a GitHub image refresh can't
    # shift preinstalled libs under the headless browser (matches the dropcatch /
    # watchdog workflows).
    runs-on: ubuntu-24.04
    # afternic was decoupled to its own scheduled workflow (source-afternic.yml,
    # dispatched by /api/cron/afternic) because, sharing this runner's 2 cores
    # with the sequential foreground sources, it slowed to >3h and got killed by
    # this job timeout (the rest of the batch finishes in ~45 min). On its own
    # runner it's back to ~40 min. So this budget is now just a safety net for
    # the fast foreground batch.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # `mode: ping` is a connectivity test: it proves the dispatch chain
      # (Vercel Cron -> CRON_SECRET -> GH_DISPATCH_TOKEN -> workflow_dispatch)
      # works end-to-end without running any source. It exits here.
      - name: Ping (no-op connectivity test)
        if: ${{ inputs.mode == 'ping' }}
        run: echo "ping ok — dispatch chain works; skipping all sources."

      - uses: ./.github/actions/setup
        if: ${{ inputs.mode != 'ping' }}

      # This orchestrator runs dropcatch_auctions + namejet_lastchance + the
      # auctions_watchdog retry INLINE, all of which launch headless Chromium via
      # Playwright. The `setup` action only pip-installs the Playwright package —
      # the browser BINARY must be installed here. `chromium` alone omits the
      # headless-shell that a headless launch needs on current Playwright, so
      # install it explicitly (this is the exact break that hit dropcatch +
      # namejet on 2026-06-04: "Executable doesn't exist … chrome-headless-shell").
      - name: Install Playwright Chromium
        if: ${{ inputs.mode != 'ping' }}
        run: python -m playwright install --with-deps chromium chromium-headless-shell

      - name: Run SNAP + auction sources (continue on failure)
        if: ${{ inputs.mode != 'ping' }}
        id: runsources
        env:
          PYTHONUNBUFFERED:            "1"
          SLACK_BOT_TOKEN:             ${{ secrets.SLACK_BOT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_NAMING_URL:         ${{ secrets.SUPABASE_NAMING_URL }}
          SUPABASE_NAMING_SERVICE_KEY: ${{ secrets.SUPABASE_NAMING_SERVICE_KEY }}
          SCRAPE_DO_TOKEN:             ${{ secrets.SCRAPE_DO_TOKEN }}
          ATOM_PARTNERSHIP_KEY:        ${{ secrets.ATOM_PARTNERSHIP_KEY }}  # atom_daily direct API (bypasses Cloudflare CSV)
          ATOM_USER_ID:                ${{ secrets.ATOM_USER_ID }}
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}  # markmonitor auto-enrich
          EFTY_PARTNER_TOKEN:          ${{ secrets.EFTY_PARTNER_TOKEN }}
          SPACESHIP_API_KEY:           ${{ secrets.SPACESHIP_API_KEY }}
          SPACESHIP_API_SECRET:        ${{ secrets.SPACESHIP_API_SECRET }}
          DYNADOT_API_KEY:             ${{ secrets.DYNADOT_API_KEY }}
          DYNADOT_API_SECRET:          ${{ secrets.DYNADOT_API_SECRET }}
          NAMESILO_API_KEY:            ${{ secrets.NAMESILO_API_KEY }}
          CF_BROWSER_ACCOUNT_ID:       ${{ secrets.CF_BROWSER_ACCOUNT_ID }}
          CF_BROWSER_API_TOKEN:        ${{ secrets.CF_BROWSER_API_TOKEN }}
          R2_ACCESS_KEY_ID:            ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:        ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # R2_ENDPOINT / R2_BUCKET are repo VARIABLES (non-secret), not secrets —
          # referencing them as secrets resolved empty and silently disabled the
          # observations->R2 upload.
          R2_ENDPOINT:                 ${{ vars.R2_ENDPOINT }}
          R2_BUCKET:                   ${{ vars.R2_BUCKET }}
          SLACK_CHANNEL_SNAP:          ${{ vars.SLACK_CHANNEL_SNAP }}
          SLACK_CHANNEL_AUCTIONS:      ${{ vars.SLACK_CHANNEL_AUCTIONS }}
        run: |
          set +e
          failed=""

          # afternic is NOT here anymore — it runs on its own scheduled workflow
          # (source-afternic.yml). See the timeout-minutes comment above.
          # namepros_marketplace ALSO decoupled — its own Vercel cron dispatches
          # source-namepros-marketplace.yml 3x/day (6 AM/1 PM/7 PM ET), mirroring Sedo.
          # ATOM stays after a quick first source so its ">4 AM ET" feed is ready.
          SOURCES="namecheap_bin atom_daily snagged_snap_sheet rob_purchases_sheet snagged_marketplace_sheet berserk_snap_sheet oxley markmonitor braden_pollack_portfolio efty_partner auctions_publish auctions_watchdog"
          for s in $SOURCES; do
            echo "::group::pipeline run $s"
            if pipeline run "$s"; then
              echo "OK: $s"
            else
              echo "::error title=$s failed::pipeline run $s exited non-zero (continuing to next source)"
              failed="$failed $s"
            fi
            echo "::endgroup::"
          done

          { echo "failed=$failed"; } >> "$GITHUB_OUTPUT"
          [ -n "$failed" ] && echo "Sources that failed:$failed" || echo "All sources completed."

      - name: Commit state changes
        if: ${{ always() && inputs.mode != 'ping' }}
        uses: ./.github/actions/commit-state
        with:
          message: "snap-orchestrator: state $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Flag run failed if any source failed
        if: ${{ always() && inputs.mode != 'ping' }}
        run: |
          failed="${{ steps.runsources.outputs.failed }}"
          if [ -n "$failed" ]; then
            echo "::error::SNAP orchestrator: failed source(s):$failed"
            exit 1
          fi

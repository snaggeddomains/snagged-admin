name: 'Source: namecheap_bin'

# Scheduling is owned by "SNAP Orchestrator" (snap-orchestrator.yml). Only
# workflow_dispatch remains so this source can still be (re)run individually.
on:
  workflow_dispatch: {}

permissions:
  contents: write   # commit updated state/ back to the repo

concurrency:
  group: source-namecheap_bin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run namecheap_bin
        env:
          SLACK_BOT_TOKEN:             ${{ secrets.SLACK_BOT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SLACK_CHANNEL_SNAP:          ${{ vars.SLACK_CHANNEL_SNAP }}
          SUPABASE_NAMING_URL:         ${{ secrets.SUPABASE_NAMING_URL }}
          SUPABASE_NAMING_SERVICE_KEY: ${{ secrets.SUPABASE_NAMING_SERVICE_KEY }}

        run: pipeline run namecheap_bin

      - name: Commit state changes
        if: ${{ !cancelled() }}
        uses: ./.github/actions/commit-state
        with:
          message: "namecheap_bin: state $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload raw artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namecheap_bin-${{ github.run_id }}
          path: /tmp/marketplace_pipeline/raw/
          retention-days: 14
          if-no-files-found: ignore

name: 'Probe: sedo.com universe-scoped search (sizing for a dump source)'

# We already know Sedo's search backend (POST common.php, JSON response)
# works anonymously — sedo_net_new.py hits it daily. What we DON'T know
# is what a full universe-scoped pull would look like:
#
#   Q1: With the user's preferred filter set (TLDs com/ai/org/co/xyz/io,
#       1-word max, no special chars, all 4 listing types), how many
#       total results does Sedo report? This sets the upper bound on
#       what a sedo_dump source would ingest.
#   Q2: Does the response include a total/numFound field so we can plan
#       pagination, or do we have to walk pages until we get an empty
#       result list?
#   Q3: Does pagination actually work? sedo_net_new only fetches page=1;
#       confirm that page=2 returns DIFFERENT domains and that pagesize=
#       500 isn't capped server-side.
#   Q4: What's the typical price + TLD distribution in the first 500?
#       Gives us a feel for what we'd be ingesting before committing to
#       the dump source build.
#
# Output is just printed to the job log — no commits, no Slack, no Supabase.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Hit Sedo search backend with universe-scoped filters
        run: |
          python3 - <<'PY'
          import json
          import requests
          from collections import Counter

          BASE_URL = "https://sedo.com/service/common.php"
          SEARCH_URL = "https://sedo.com/search/"
          USER_AGENT = (
              "Mozilla/5.0 (Linux; Android 6.0; Nexus 5 Build/MRA58N) "
              "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Mobile Safari/537.36"
          )

          # User-specified filter set from sedo.com/search/?cc[0]=com&cc[1]=ai&
          # cc[2]=org&cc[3]=co&cc[4]=xyz&cc[5]=io&number_of_words_max=1
          # Plus all 4 listing types (BIN/Negotiable/Marketplace auctions/Expiring)
          # and no special characters (no hyphens, no digits, no IDN).
          TLDS = ["com", "ai", "org", "co", "xyz", "io"]
          PAGE_SIZE = 500

          def build_payload(page: int):
              payload = [
                  ("safe_search", 2),
                  ("synonyms", "true"),
                  ("listing_type[]", 1),  # Buy now
                  ("listing_type[]", 2),  # Negotiable
                  ("listing_type[]", 3),  # Marketplace auctions
                  ("listing_type[]", 5),  # Expiring Domain Auctions
                  ("auction_group[]", 62),
                  ("auction_event", ""),
                  ("price_start", 0),
                  ("price_end", 0),
                  ("price_currency", 3),
                  ("traffic_start", 0),
                  ("traffic_end", 0),
                  ("number_of_words_min", 1),
                  ("number_of_words_max", 1),
                  ("len_min", 1),
                  ("len_max", 0),
                  # special_characters values 1/2/3 = no-hyphen / no-numerals
                  # / no-IDN (these are EXCLUDE flags — having them ON means
                  # "exclude special chars")
                  ("special_characters[]", 3),
                  ("special_characters[]", 1),
                  ("special_characters[]", 2),
                  ("cat[]", 0),
                  ("cat[]", 0),
                  ("cat[]", 0),
                  ("type", 0),
                  ("special_inventory", 4),
                  ("kws", "contains"),
                  ("age_min", 0),
                  ("age_max", 0),
                  ("keyword", ""),
                  ("page", page),
                  ("rel", 6),
                  ("orderdirection", 2),
                  ("domainIds", ""),
              ]
              for tld in TLDS:
                  payload.append(("cc[]", tld))
              payload.extend([
                  ("member", ""),
                  ("v", "0.1"),
                  ("o", "json"),
                  ("m", "search"),
                  ("f", "requestSearch"),
                  ("pagesize", PAGE_SIZE),
                  ("keywords_join", "AND"),
                  ("loadListingFeatured", "true"),
                  ("language", "us"),
              ])
              return payload

          headers = {
              "content-type": "application/x-www-form-urlencoded; charset=UTF-8",
              "origin": "https://sedo.com",
              "referer": SEARCH_URL,
              "x-requested-with": "XMLHttpRequest",
              "user-agent": USER_AGENT,
          }

          sess = requests.Session()
          sess.get(SEARCH_URL, timeout=30, headers={"user-agent": USER_AGENT})

          def fetch(page: int):
              resp = sess.post(BASE_URL, data=build_payload(page), headers=headers, timeout=60)
              resp.raise_for_status()
              return resp.json()

          # ---- Q1+Q2: total results, response structure ----
          print("=" * 60)
          print("Q1+Q2: Page 1 fetch — total result count + response shape")
          print("=" * 60)
          data = fetch(1)
          general = data.get("b", {}).get("general", {})
          search_req = general.get("searchRequest", {}) or {}
          result_list = search_req.get("resultList") or []
          print(f"  page 1 result count: {len(result_list)}")
          print()
          print("  searchRequest top-level keys:")
          for k, v in search_req.items():
              if isinstance(v, (str, int, float, bool)) or v is None:
                  print(f"    {k}: {v}")
              elif isinstance(v, list):
                  print(f"    {k}: <list len={len(v)}>")
              elif isinstance(v, dict):
                  print(f"    {k}: <dict keys={list(v.keys())[:8]}>")
              else:
                  print(f"    {k}: <{type(v).__name__}>")
          print()
          print("  Other 'general' keys (looking for totals):")
          for k, v in general.items():
              if k == "searchRequest":
                  continue
              if isinstance(v, (str, int, float, bool)) or v is None:
                  print(f"    {k}: {v}")
              elif isinstance(v, dict):
                  print(f"    {k}: <dict keys={list(v.keys())[:8]}>")
              else:
                  print(f"    {k}: <{type(v).__name__} len={len(v) if hasattr(v, '__len__') else '?'}>")
          print()

          # Hunt for any numeric "total" / "count" / "numFound" field anywhere
          # in the response — Sedo's JSON is nested.
          def walk(obj, path=""):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      kl = k.lower()
                      if any(t in kl for t in ("total", "count", "found", "numresults", "hits")):
                          if isinstance(v, (int, str)):
                              print(f"    {path}.{k} = {v}")
                      walk(v, f"{path}.{k}")
              elif isinstance(obj, list) and obj and isinstance(obj[0], dict):
                  walk(obj[0], f"{path}[0]")

          print("  Candidate total/count fields anywhere in response:")
          walk(data, "data")
          print()

          # ---- Q4: TLD + price distribution in page 1 ----
          print("=" * 60)
          print("Q4: TLD + price distribution in first 500 results")
          print("=" * 60)
          tld_counter = Counter()
          price_buckets = Counter()
          sample_domains = []
          for row in result_list:
              domain = str(row.get("0") or "").lower()
              tld = str(row.get("4002") or "").lower().lstrip(".")
              price_raw = row.get("4000")
              try:
                  price = float(str(price_raw).replace("$", "").replace(",", "").strip()) if price_raw else None
              except (TypeError, ValueError):
                  price = None
              tld_counter[tld] += 1
              if price is None:
                  price_buckets["unknown"] += 1
              elif price < 100:
                  price_buckets["<$100"] += 1
              elif price < 500:
                  price_buckets["$100-499"] += 1
              elif price < 2000:
                  price_buckets["$500-1999"] += 1
              elif price < 10000:
                  price_buckets["$2k-9.9k"] += 1
              else:
                  price_buckets[">=$10k"] += 1
              if len(sample_domains) < 12:
                  sample_domains.append(f"{domain} ({price})")
          print("  TLD distribution:")
          for tld, n in tld_counter.most_common():
              print(f"    .{tld}: {n}")
          print()
          print("  Price buckets:")
          for b, n in sorted(price_buckets.items()):
              print(f"    {b}: {n}")
          print()
          print("  First 12 sample (domain, price):")
          for s in sample_domains:
              print(f"    {s}")
          print()

          # ---- Q3: pagination — does page 2 return DIFFERENT rows? ----
          print("=" * 60)
          print("Q3: Pagination — does page 2 return different domains?")
          print("=" * 60)
          page1_domains = {str(r.get("0") or "").lower() for r in result_list}
          data2 = fetch(2)
          result_list_2 = data2.get("b", {}).get("general", {}).get("searchRequest", {}).get("resultList") or []
          page2_domains = {str(r.get("0") or "").lower() for r in result_list_2}
          overlap = page1_domains & page2_domains
          print(f"  page 2 result count: {len(result_list_2)}")
          print(f"  page1 ∩ page2 overlap: {len(overlap)}  (expect 0 if pagination works)")
          if overlap:
              print(f"    overlap sample: {list(overlap)[:5]}")
          print()
          print("Done.")
          PY

name: 'Probe: sedo.com tail-page composition (does the cheap long tail justify a full dump?)'

# Follow-up to the initial sizing probe. We learned:
#   - hitsTotal = 263,993 for the universe-scoped filter set
#   - results are sorted price-desc — first 500 are headline names like
#     services.ai @ $15M, group.ai @ $995K, etc., 61% with NULL price
#   - Only .com / .ai surface in the first 500; .org/.co/.xyz/.io are
#     buried deeper
#
# Open question before committing to a 9-minute / 264K-row dump source:
# does the BOTTOM of the catalog actually contain interesting names, or
# is it nothing but parked-domain dross we'd waste storage on?
#
# This probe fetches page 528 (the last page) PLUS page 264 (midpoint)
# for comparison, and reports the same TLD / price / sample breakdown
# we got from page 1. Decision: if midpoint + tail show real domains in
# the .co/.org/.xyz/.io space at $100-2K prices, build the dump source.
# If they're all $0 unknown-price junk, narrow our scope.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Hit Sedo search backend at head / midpoint / tail
        run: |
          python3 - <<'PY'
          import requests
          from collections import Counter

          BASE_URL = "https://sedo.com/service/common.php"
          SEARCH_URL = "https://sedo.com/search/"
          USER_AGENT = (
              "Mozilla/5.0 (Linux; Android 6.0; Nexus 5 Build/MRA58N) "
              "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Mobile Safari/537.36"
          )
          TLDS = ["com", "ai", "org", "co", "xyz", "io"]
          PAGE_SIZE = 500

          def build_payload(page: int):
              payload = [
                  ("safe_search", 2), ("synonyms", "true"),
                  ("listing_type[]", 1), ("listing_type[]", 2),
                  ("listing_type[]", 3), ("listing_type[]", 5),
                  ("auction_group[]", 62), ("auction_event", ""),
                  ("price_start", 0), ("price_end", 0), ("price_currency", 3),
                  ("traffic_start", 0), ("traffic_end", 0),
                  ("number_of_words_min", 1), ("number_of_words_max", 1),
                  ("len_min", 1), ("len_max", 0),
                  ("special_characters[]", 3), ("special_characters[]", 1),
                  ("special_characters[]", 2),
                  ("cat[]", 0), ("cat[]", 0), ("cat[]", 0),
                  ("type", 0), ("special_inventory", 4),
                  ("kws", "contains"), ("age_min", 0), ("age_max", 0),
                  ("keyword", ""), ("page", page), ("rel", 6),
                  ("orderdirection", 2), ("domainIds", ""),
              ]
              for tld in TLDS:
                  payload.append(("cc[]", tld))
              payload.extend([
                  ("member", ""), ("v", "0.1"), ("o", "json"),
                  ("m", "search"), ("f", "requestSearch"),
                  ("pagesize", PAGE_SIZE), ("keywords_join", "AND"),
                  ("loadListingFeatured", "true"), ("language", "us"),
              ])
              return payload

          headers = {
              "content-type": "application/x-www-form-urlencoded; charset=UTF-8",
              "origin": "https://sedo.com", "referer": SEARCH_URL,
              "x-requested-with": "XMLHttpRequest", "user-agent": USER_AGENT,
          }
          sess = requests.Session()
          sess.get(SEARCH_URL, timeout=30, headers={"user-agent": USER_AGENT})

          def fetch(page: int):
              resp = sess.post(BASE_URL, data=build_payload(page), headers=headers, timeout=60)
              resp.raise_for_status()
              return resp.json()

          def bucket_price(p):
              if p is None: return "unknown"
              if p < 100: return "<$100"
              if p < 500: return "$100-499"
              if p < 2000: return "$500-1999"
              if p < 10000: return "$2k-9.9k"
              return ">=$10k"

          def parse_price(v):
              if v in (None, ""): return None
              try: return float(str(v).replace("$","").replace(",","").strip())
              except (TypeError, ValueError): return None

          def summarize(page_num: int):
              print("=" * 60)
              print(f"PAGE {page_num}")
              print("=" * 60)
              data = fetch(page_num)
              sr = data.get("b", {}).get("general", {}).get("searchRequest", {}) or {}
              rows = sr.get("resultList") or []
              print(f"  rows returned: {len(rows)}  (hitsTotal: {sr.get('hitsTotal')})")
              tld_c = Counter()
              price_c = Counter()
              samples = []
              for row in rows:
                  d = str(row.get("0") or "").lower()
                  t = str(row.get("4002") or "").lower().lstrip(".")
                  p = parse_price(row.get("4000"))
                  tld_c[t] += 1
                  price_c[bucket_price(p)] += 1
                  if len(samples) < 20:
                      samples.append((d, p))
              print("  TLD distribution:")
              for t, n in tld_c.most_common():
                  print(f"    .{t}: {n}")
              print("  Price buckets:")
              for b in ("<$100","$100-499","$500-1999","$2k-9.9k",">=$10k","unknown"):
                  if price_c.get(b): print(f"    {b}: {price_c[b]}")
              print("  First 20 sample (domain, price):")
              for d, p in samples:
                  print(f"    {d}  ({p})")
              print()
              return rows

          # Page 264 = midpoint, page 528 = last page
          summarize(264)
          summarize(528)

          print("Done.")
          PY

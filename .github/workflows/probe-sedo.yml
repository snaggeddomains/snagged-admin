name: 'Probe: sedo_dump crawl runner (feature-branch dispatch harness)'

# NOTE: On the feature branch this file is repurposed as the dispatch
# harness for the new sedo_dump source. A brand-new workflow file
# (source-sedo-dump.yml) cannot be triggered via the workflow_dispatch API
# until it lands on the default branch, but probe-sedo.yml IS already
# registered there, so dispatching it with ref=<feature-branch> runs THIS
# copy. The production workflow is .github/workflows/source-sedo-dump.yml;
# main's copy of probe-sedo.yml is untouched.
#
# Crawl behaviour is controlled entirely by env below — flip between a
# smoke run (one TLD, tiny request cap) and the full ~280k capture without
# touching code.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: source-sedo_dump
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330        # under GitHub's 360-min hard cap
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run sedo_dump crawl
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_NAMING_URL:         ${{ secrets.SUPABASE_NAMING_URL }}
          SUPABASE_NAMING_SERVICE_KEY: ${{ secrets.SUPABASE_NAMING_SERVICE_KEY }}
          # ---- FULL capture: default 7-TLD universe scope, generous budget
          #      so the whole inventory lands in one run. Self-stops at the
          #      time budget (well before the job hard cap) and commits.
          SEDO_DUMP_TIME_BUDGET_SEC: "18000"   # 300 min
          SEDO_DUMP_MAX_REQUESTS: "25000"
        run: pipeline run sedo_dump
      - name: Commit state changes
        if: always()   # capture partial/failed state too — the crawler streams progress
        uses: ./.github/actions/commit-state
        with:
          message: "sedo_dump: full-crawl state $(date -u +%Y-%m-%dT%H:%M:%SZ)"

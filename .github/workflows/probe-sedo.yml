name: 'Probe: sedo.com pagination depth cap (where does hitsTotal go to 0?)'

# Last probe found that pages 264 + 528 both return 0 rows AND
# hitsTotal: 0, while page 1 had hitsTotal: 263,993. So either:
#   (a) Sedo caps deep pagination — only the top N rows are reachable
#       via page=N regardless of how many documents matched, OR
#   (b) Search state is bound to something fragile (session cookie,
#       search token) and a deep page= jump invalidates the query.
#
# This probe walks a SINGLE session from page 1 outward, doubling the
# page index each step until we hit the empty-result wall. That bounds
# the actual reachable inventory and tells us how to design sedo_dump
# (or whether to abandon the broad dump and stick with focused
# narrow-keyword scrapes).
#
# Strategy: page 1, 2, 5, 10, 20, 50, 100, 200. Log rows + hitsTotal
# at each. The page where rows drops to 0 is our cap.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Find Sedo's pagination depth cap
        run: |
          python3 - <<'PY'
          import requests
          import time

          BASE_URL = "https://sedo.com/service/common.php"
          SEARCH_URL = "https://sedo.com/search/"
          USER_AGENT = (
              "Mozilla/5.0 (Linux; Android 6.0; Nexus 5 Build/MRA58N) "
              "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Mobile Safari/537.36"
          )
          TLDS = ["com", "ai", "org", "co", "xyz", "io"]
          PAGE_SIZE = 500

          def build_payload(page: int):
              payload = [
                  ("safe_search", 2), ("synonyms", "true"),
                  ("listing_type[]", 1), ("listing_type[]", 2),
                  ("listing_type[]", 3), ("listing_type[]", 5),
                  ("auction_group[]", 62), ("auction_event", ""),
                  ("price_start", 0), ("price_end", 0), ("price_currency", 3),
                  ("traffic_start", 0), ("traffic_end", 0),
                  ("number_of_words_min", 1), ("number_of_words_max", 1),
                  ("len_min", 1), ("len_max", 0),
                  ("special_characters[]", 3), ("special_characters[]", 1),
                  ("special_characters[]", 2),
                  ("cat[]", 0), ("cat[]", 0), ("cat[]", 0),
                  ("type", 0), ("special_inventory", 4),
                  ("kws", "contains"), ("age_min", 0), ("age_max", 0),
                  ("keyword", ""), ("page", page), ("rel", 6),
                  ("orderdirection", 2), ("domainIds", ""),
              ]
              for tld in TLDS:
                  payload.append(("cc[]", tld))
              payload.extend([
                  ("member", ""), ("v", "0.1"), ("o", "json"),
                  ("m", "search"), ("f", "requestSearch"),
                  ("pagesize", PAGE_SIZE), ("keywords_join", "AND"),
                  ("loadListingFeatured", "true"), ("language", "us"),
              ])
              return payload

          headers = {
              "content-type": "application/x-www-form-urlencoded; charset=UTF-8",
              "origin": "https://sedo.com", "referer": SEARCH_URL,
              "x-requested-with": "XMLHttpRequest", "user-agent": USER_AGENT,
          }
          sess = requests.Session()
          sess.get(SEARCH_URL, timeout=30, headers={"user-agent": USER_AGENT})

          def fetch(page: int):
              resp = sess.post(BASE_URL, data=build_payload(page), headers=headers, timeout=60)
              resp.raise_for_status()
              data = resp.json()
              sr = data.get("b", {}).get("general", {}).get("searchRequest", {}) or {}
              return len(sr.get("resultList") or []), sr.get("hitsTotal")

          print("Walking pages on a single session at pagesize=500.")
          print("Cumulative rows assumes no overlap (the page1-page2 probe confirmed that).")
          print()
          print(f"{'page':>6}  {'rows':>5}  {'hitsTotal':>10}  {'cumulative':>10}")
          print(f"{'----':>6}  {'----':>5}  {'---------':>10}  {'----------':>10}")
          cumulative = 0
          for page in [1, 2, 5, 10, 20, 50, 100, 200]:
              try:
                  rows, hits = fetch(page)
              except Exception as e:
                  print(f"{page:>6}  ERROR: {e}")
                  break
              cumulative += rows
              print(f"{page:>6}  {rows:>5}  {str(hits):>10}  {cumulative:>10}")
              if rows == 0:
                  print(f"  --> empty result at page {page}; stopping walk")
                  break
              time.sleep(0.5)

          # Bisect between last non-empty and first empty page to find
          # the exact cap (or close to it). Skip if walk completed all
          # pages without hitting zero.
          PY

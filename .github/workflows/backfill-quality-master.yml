name: Backfill quality_score (Master Domain List)

# Compute the structural quality_score on the Master Domain List using the SAME
# formula as name_universe ingest (round(zipf_frequency(sld,'en') * tld_weight, 2)).
# Master is imported externally and never got the score; this lets the naming
# exercise rank Master candidates by the same quality signal as the universe.
#
# Dry-run by DEFAULT (preview counts only) — flip `commit` to true to write.
# When dispatched by the admin Imports tool with then_enrich=true, it chains a
# quality-banded LLM enrich-batch submit AFTER the score is written, scoped to
# the just-imported source so only its new names are charged.
# Prereq SQL (run once in the masterlist project):
#   alter table "Master Domain List" add column if not exists quality_score double precision;
#   create index if not exists idx_master_quality
#     on "Master Domain List" (quality_score desc nulls last);
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Actually write quality_score (otherwise dry-run preview)
        type: boolean
        default: false
      max_rows:
        description: Cap rows processed this run (blank = all)
        default: ""
      pos:
        description: Backfill part_of_speech (WordNet) on single-word rows instead of quality_score
        type: boolean
        default: false
      then_enrich:
        description: After backfill, submit a quality-banded enrich batch for the new names
        type: boolean
        default: false
      enrich_quality_min:
        description: quality_score floor for the auto-enrich (blank = no floor)
        default: ""
      enrich_source:
        description: Limit the auto-enrich to this source (blank = all eligible)
        default: ""
      enrich_new_since:
        description: Net-new only — enrich rows created at/after this ISO time (blank = all)
        default: ""

permissions:
  contents: write

concurrency:
  group: backfill-quality-master
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY:              ${{ secrets.ANTHROPIC_API_KEY }}
      MASTERLIST_SUPABASE_URL:        ${{ secrets.MASTERLIST_SUPABASE_URL }}
      MASTERLIST_SUPABASE_SECRET_KEY: ${{ secrets.MASTERLIST_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Backfill quality_score / part_of_speech (Master)
        run: |
          pipeline backfill-structural \
            --target master \
            ${{ github.event.inputs.pos == 'true' && '--pos' || '' }} \
            ${{ github.event.inputs.max_rows != '' && format('--max-rows {0}', github.event.inputs.max_rows) || '' }} \
            ${{ github.event.inputs.commit == 'true' && '--commit' || '' }}

      # Optional second leg: enrich the freshly-scored, freshly-imported names.
      # Runs only when the import asked for it AND we actually wrote scores.
      # Values come in as env vars + a bash array so a source with spaces
      # (e.g. "Reflex Publishing") is quoted correctly.
      - name: Auto-enrich new names (quality-banded, Batches API)
        if: ${{ github.event.inputs.then_enrich == 'true' && github.event.inputs.commit == 'true' }}
        env:
          ENRICH_QMIN:  ${{ github.event.inputs.enrich_quality_min }}
          ENRICH_SRC:   ${{ github.event.inputs.enrich_source }}
          ENRICH_SINCE: ${{ github.event.inputs.enrich_new_since }}
        run: |
          args=(auto --commit --target master --min-batch-saving 5)
          [ -n "$ENRICH_QMIN" ]  && args+=(--quality-min "$ENRICH_QMIN")
          [ -n "$ENRICH_SRC" ]   && args+=(--source "$ENRICH_SRC")
          [ -n "$ENRICH_SINCE" ] && args+=(--new-since "$ENRICH_SINCE")
          pipeline enrich-batch "${args[@]}"
      - name: Commit enrich-batch state
        if: ${{ success() && github.event.inputs.then_enrich == 'true' && github.event.inputs.commit == 'true' }}
        uses: ./.github/actions/commit-state
        with:
          message: "enrich-batch: auto-submit after master import"

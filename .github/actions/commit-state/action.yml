name: 'Commit state with rebase-retry'
description: |
  Adds state/, commits with the given message, and pushes — retrying on
  push rejection by rebasing onto the latest origin/main. Prevents race
  failures when multiple scheduled workflows finish near-simultaneously.

inputs:
  message:
    description: 'Commit message'
    required: true
  max_attempts:
    description: 'Maximum push attempts before giving up'
    required: false
    default: '6'

runs:
  using: composite
  steps:
    - name: Commit and push state with retry
      shell: bash
      run: |
        set -euo pipefail
        git add state/
        if git diff --cached --quiet; then
          echo "No state changes to commit."
          exit 0
        fi
        git commit -m "${{ inputs.message }}"
        attempt=1
        max=${{ inputs.max_attempts }}
        # Exponential backoff between rebase retries: 2s, 4s, 8s, 16s, 32s.
        delays=(0 2 4 8 16 32)
        while true; do
          if git push origin HEAD; then
            echo "Push succeeded on attempt $attempt."
            exit 0
          fi
          if [ "$attempt" -ge "$max" ]; then
            echo "Push failed after $attempt attempts; giving up."
            exit 1
          fi
          delay=${delays[$attempt]:-32}
          echo "Push rejected on attempt $attempt; sleeping ${delay}s, rebasing, and retrying."
          sleep "$delay"
          # state/ is machine-generated, last-write-wins data. When two runs of the
          # same source pipeline push near-simultaneously they collide on the SAME
          # state JSON, and a plain `git pull --rebase` dies on the conflict (this is
          # what fails the job). Resolve by keeping THIS run's freshly-written state:
          # during a rebase, "-X theirs" prefers the commit being replayed (ours). If
          # it still can't apply, abort cleanly so the next loop re-fetches and retries
          # rather than leaving a half-finished rebase and failing the job.
          if ! git pull --rebase -X theirs origin "$(git rev-parse --abbrev-ref HEAD)"; then
            echo "Rebase could not auto-resolve; aborting and retrying."
            git rebase --abort 2>/dev/null || true
          fi
          attempt=$((attempt + 1))
        done
